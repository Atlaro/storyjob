name: storyjob
description: "StoryJob - Human Opportunity Network"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.1
  cached_network_image: ^3.4.1

  # Voice & Audio
  speech_to_text: ^7.0.0
  record: ^5.1.2
  audioplayers: ^6.0.0

  # Permissions & System
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  share_plus: ^10.0.2

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Local Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10

  # Push Notifications
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Analytics & Crash Reporting
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3

  # State Management
  provider: ^6.1.2

  # Utilities
  uuid: ^4.5.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/icons/
    - assets/images/
    - assets/images/splash/
    - assets/images/onboarding/
    - assets/images/marketing/  # <--- Hier neu hinzugefügt

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/app_icon_dark.png"
  adaptive_icon_background: "#0D0F1D"
  adaptive_icon_foreground: "assets/branding/app_icon_dark.png"

flutter_native_splash:
  color: "#0D0F1D"
  image: "assets/images/splash/splash.webp"
  android_12:
    color: "#0D0F1D"
    image: "assets/images/splash/splash.webp"