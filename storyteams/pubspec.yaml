name: storyteams
description: "StoryJob Teams – Team- & Einsatzmanagement im StoryJob Ökosystem."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.4
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  background_color: "#0B0F19"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#0B0F19"
    theme_color: "#0B0F19"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png