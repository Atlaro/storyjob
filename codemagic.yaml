workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: StoryJob

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.storyjob.app
      flutter: stable
      xcode: latest

    scripts:
      - name: Clean project and get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS App (IPA)
        script: |
          flutter build ipa --release --export-method app-store

      - name: Debug generated files
        script: |
          echo "=== IPA FILES ==="
          find . -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true