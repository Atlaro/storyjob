workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: StoryJob

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest

    scripts:
      - name: Set up code signing settings on Codemagic
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "de.storyjob.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Clean project and get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS App (IPA)
        script: |
          flutter build ipa --release --export-method app-store

      - name: Debug generated files
        script: |
          echo "=== IPA FILES ==="
          find . -name "*.ipa"
          echo "=== XCARCHIVE FILES ==="
          find . -name "*.xcarchive"
          echo "=== BUILD DIRECTORY ==="
          ls -R build || true

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true