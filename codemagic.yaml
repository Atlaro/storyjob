workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: StoryJob

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.storyjob.app

    scripts:
      - name: Clean project
        script: |
          flutter clean
          flutter pub get

      - name: Configure signing
        script: |
          cd ios
          xcode-project use-profiles

      - name: Build archive
        script: |
          flutter build ipa --release --export-method app-store

      - name: Force IPA export and debug
        script: |
          echo "=== IPA FILES BEFORE ==="
          find . -name "*.ipa"

          echo "=== ARCHIVES ==="
          find . -name "*.xcarchive"

          ls -la build/ios/archive || true
          ls -la build/ios/ipa || true

          echo "=== IPA FILES AFTER ==="
          find . -name "*.ipa"

    artifacts:
      - build/ios/ipa/*.ipa
      - build/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true