workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: StoryJob

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.storyjob.app

    scripts:
      - name: Use automatic provisioning in Xcode
        script: |
          cd ios
          xcode-project use-profiles

      - name: Clean project and get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS App
        script: |
          flutter build ipa --release --export-method app-store

      - name: Move IPA to artifact folder
        script: |
          mkdir -p build/ios/ipa
          find build/ios/archive -name "*.xcarchive" -exec xcodebuild -exportArchive -archivePath {} -exportOptionsPath ios/ExportOptions.plist -exportPath build/ios/ipa \; || true
          # Fallback: Falls die IPA woanders liegt, kopieren wir sie direkt in den Artefakt-Pfad
          find . -name "*.ipa" -exec cp {} build/ios/ipa/ \;

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true