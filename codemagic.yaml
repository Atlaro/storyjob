workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      xcode: latest

      # Hier binden wir deine Zertifikatsgruppe ein, damit Codemagic das Provisioning Profile findet
      vars:
        BUNDLE_IDENTIFIER: "de.storyjob.app"

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.storyjob.app

      groups:
        - app_store_credentials

    scripts:
      - name: Clean project and get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS App
        script: |
          flutter build ipa --release --export-method app-store

    artifacts:
      - build/ios/ipa/*.ipa