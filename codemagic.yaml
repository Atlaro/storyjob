workflows:
  ios-release-workflow:
    name: StoryJob iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials # Hier hinterlegst du später deine Apple-Zugangsdaten sicher
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build iOS App for TestFlight
        script: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: api_key
        # Automatischer Upload zu TestFlight nach erfolgreichem Build
        submit_to_testflight: true
        expire_build_waiting_for_test: true