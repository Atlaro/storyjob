workflows:
  ios-release-workflow:
    name: StoryJob iOS Release

    max_build_duration: 60
    instance_type: mac_mini_m1

    integrations:
      app_store_connect: StoryJob

    environment:
      flutter: stable
      xcode: latest

      ios_signing:
        distribution_type: app_store
        bundle_identifier: de.storyjob.app

    scripts:
      - name: Set up code signing settings on Codemagic
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "de.storyjob.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Clean project and get dependencies
        script: |
          flutter clean
          flutter pub get

      - name: Build iOS App (IPA)
        script: |
          flutter build ipa --release --export-method app-store

      - name: Verify IPA creation
        script: |
          echo "=== Gefundene IPA-Dateien ==="
          find . -name "*.ipa"
          ls -la build/ios/ipa || true

    artifacts:
      - build/ios/ipa/*.ipa
      - "*.ipa"

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true